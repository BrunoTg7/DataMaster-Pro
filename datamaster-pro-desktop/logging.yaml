version: 1
disable_existing_loggers: false

filters:
  session_context:
    (): src.core.session_context.SessionFilter

formatters:
  standard:
    format: "[%(asctime)s] %(levelname)-7s %(name)-30s [%(session_id)s] %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  detailed:
    format: "[%(asctime)s] %(levelname)-7s %(name)-30s %(funcName)s:%(lineno)d [%(session_id)s] %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  audit:
    format: "%(asctime)s %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    stream: ext://sys.stdout
    formatter: standard
    level: INFO
    filters: [session_context]
  file:
    class: logging.handlers.RotatingFileHandler
    filename: "{log_dir}/datamaster.log"
    formatter: detailed
    level: DEBUG
    maxBytes: 10485760
    backupCount: 5
    encoding: utf-8
    filters: [session_context]
  sync_file:
    class: logging.handlers.RotatingFileHandler
    filename: "{log_dir}/sync.log"
    formatter: detailed
    level: DEBUG
    maxBytes: 5242880
    backupCount: 3
    encoding: utf-8
    filters: [session_context]
  audit_file:
    class: logging.handlers.RotatingFileHandler
    filename: "{log_dir}/audit.log"
    formatter: audit
    level: INFO
    maxBytes: 5242880
    backupCount: 3
    encoding: utf-8

loggers:
  src.core.sync.sync_manager:
    level: DEBUG
    handlers: [sync_file]
    propagate: false
  src.tools:
    level: DEBUG
    handlers: [file]
    propagate: false
  audit:
    level: INFO
    handlers: [audit_file]
    propagate: false

root:
  level: DEBUG
  handlers: [console, file]
  filters: [session_context]
