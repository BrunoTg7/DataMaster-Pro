[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "datamaster-pro"
version = "1.5.0"
description = "Plataforma de processamento de dados para e-commerce"
requires-python = ">=3.11"
dependencies = [
    "customtkinter>=5.2.0",
    "supabase>=2.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "numpy>=1.24.0",
    "cryptography>=41.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "pypdf>=4.0.0",
    "pymupdf>=1.23.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "tkinterdnd2>=0.4.3",
    "thefuzz>=0.22.0",
    "python-Levenshtein>=0.21.0",
    "rapidfuzz>=3.5.0",
    "playwright>=1.40.0",
    "httpx>=0.26.0",
    "textblob>=0.17.1",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "pdf2image>=1.16.3",
    "opencv-python>=4.8.0",
    "paddleocr>=2.7.0",
    "endesive>=0.1.0",
    "pyOpenSSL>=23.0.0",
    "jinja2>=3.1.0",
    "phonenumbers>=8.13.0",
    "plyer>=2.1.0",
    "pytrends>=4.9.0",
    "scikit-learn>=1.3.0",
    "weasyprint>=60.0",
    "psutil>=5.9.0",
    "pyarrow>=14.0.0",
    "matplotlib>=3.8.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "qrcode[pil]>=7.4",
    "winotify>=1.1.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]

[tool.ruff]
line-length = 120
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "slow: testes lentos",
    "integration: testes de integração",
]
